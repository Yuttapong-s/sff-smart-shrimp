name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    # Boots the real stack (TimescaleDB, EMQX, api, ingest, simulator) and checks data flows end to end.
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Write CI env
        run: |
          cat > .env <<EOF
          SITE_ADDRESS=:80
          COOKIE_SECURE=false
          HTTP_PORT=8080
          HTTPS_PORT=8443
          POSTGRES_PASSWORD=ci
          JWT_SECRET=ci-secret-0123456789abcdef0123456789abcdef
          ADMIN_PASSWORD=ci-admin-pass
          EMQX_DASHBOARD_PASSWORD=ci-dashboard
          SEED_DEMO=true
          SEED_ZONES=2
          SEED_PONDS_PER_ZONE=10
          SIM_INTERVAL_SEC=2
          SIM_BACKFILL_HOURS=1
          EOF
      - run: docker compose --env-file .env --profile sim up -d --build --wait --wait-timeout 300 db emqx api ingest caddy
      - run: docker compose --env-file .env --profile sim up -d simulator
      - name: Wait for live data
        run: |
          for i in $(seq 1 60); do
            n=$(docker compose --env-file .env exec -T db psql -U sff -d sff -Atc "select count(*) from pond_latest where time > now() - interval '30 seconds'")
            echo "live ponds: $n"
            [ "$n" -ge 15 ] && exit 0
            sleep 2
          done
          exit 1
      - name: API smoke test
        run: |
          curl -sf localhost:8080/api/health
          curl -sf -c c.txt -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-admin-pass"}' localhost:8080/api/auth/login
          curl -sf -b c.txt localhost:8080/api/farms/1/overview | jq -e '.ponds | length == 20'
          curl -sf -b c.txt 'localhost:8080/api/ponds/1/readings?range=24h' | jq -e '.t | length > 0'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/farms)" = 401
      - if: failure()
        run: docker compose --env-file .env --profile sim logs --tail 100
      - if: always()
        run: docker compose --env-file .env --profile sim down -v
