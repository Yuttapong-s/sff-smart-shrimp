<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SFF Smart Shrimp</title>
  <meta name="description" content="ระบบติดตามคุณภาพน้ำและควบคุมฟาร์มกุ้งขาว">
  <meta name="theme-color" content="#0b5cab">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/vendor/uplot/uPlot.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <img src="/icons/icon.svg" alt="" width="28" height="28">
      <span id="farm-name">SFF Smart Shrimp</span>
    </a>
    <nav class="topnav" aria-label="เมนูหลัก">
      <a href="#/" data-nav="overview">ภาพรวม</a>
      <a href="#/alarms" data-nav="alarms">แจ้งเตือน <span class="badge" data-alarm-count hidden></span></a>
      <a href="#/manual" data-nav="manual">บันทึก</a>
      <a href="#/settings" data-nav="settings">ตั้งค่า</a>
    </nav>
    <div class="topbar-right">
      <a id="outbox-badge" class="outbox-badge" href="#/manual" hidden></a>
      <span id="conn" class="conn" title="สถานะการเชื่อมต่อ"></span>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="สลับโหมดสว่าง/มืด">◐</button>
      <button id="logout" class="icon-btn" type="button" aria-label="ออกจากระบบ" hidden>⎋</button>
    </div>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <main id="view" tabindex="-1"></main>

  <nav class="bottomnav" aria-label="เมนูหลัก">
    <a href="#/" data-nav="overview"><span aria-hidden="true">▦</span>ภาพรวม</a>
    <a href="#/alarms" data-nav="alarms"><span aria-hidden="true">⚠</span>แจ้งเตือน<span class="badge" data-alarm-count hidden></span></a>
    <a href="#/manual" data-nav="manual"><span aria-hidden="true">✎</span>บันทึก</a>
    <a href="#/settings" data-nav="settings"><span aria-hidden="true">⚙</span>ตั้งค่า</a>
  </nav>
</body>
</html>
