name: Deploy

# Builds the image, pushes to GHCR, then pulls and restarts on the VPS.
# Required secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY. The VPS needs the repo's deploy/
# folder at ~/sff/deploy with a filled-in .env (see deploy/.env.example).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/sff/deploy
            export IMAGE='${{ needs.build.outputs.image }}'
            docker compose --env-file .env pull api ingest
            docker compose --env-file .env up -d --wait api ingest caddy
            docker image prune -f
