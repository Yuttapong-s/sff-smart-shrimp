name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    # Boots the real stack (TimescaleDB, EMQX, api, ingest, simulator) and checks data flows end to end.
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v5
      - name: Write CI env
        run: |
          cat > .env <<EOF
          SITE_ADDRESS=:80
          COOKIE_SECURE=false
          HTTP_PORT=8080
          HTTPS_PORT=8443
          POSTGRES_PASSWORD=ci
          JWT_SECRET=ci-secret-0123456789abcdef0123456789abcdef
          ADMIN_PASSWORD=ci-admin-pass
          EMQX_DASHBOARD_PASSWORD=ci-dashboard
          SEED_DEMO=true
          SEED_UNITS=2
          SEED_PONDS_MIN=4
          SEED_PONDS_MAX=6
          SIM_INTERVAL_SEC=2
          SIM_BACKFILL_HOURS=1
          EOF
      - run: docker compose --env-file .env --profile sim up -d --build --wait --wait-timeout 300 db emqx api ingest alerter caddy
      - run: docker compose --env-file .env --profile sim up -d simulator
      - name: Wait for live data
        run: |
          for i in $(seq 1 60); do
            n=$(docker compose --env-file .env exec -T db psql -U sff -d sff -Atc "select (select count(*) from pond_latest where time > now() - interval '30 seconds') || ' ' || (select count(*) from ras_latest where time > now() - interval '30 seconds')")
            echo "live ponds / RAS: $n"
            set -- $n
            [ "$1" -ge 8 ] && [ "$2" -ge 2 ] && exit 0
            sleep 2
          done
          exit 1
      - name: API smoke test
        run: |
          curl -sf localhost:8080/api/health
          curl -sf -c c.txt -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-admin-pass"}' localhost:8080/api/auth/login
          curl -sf -b c.txt localhost:8080/api/farms/1/overview | jq -e '(.units | length == 2) and ((.ponds | length) == ([.units[].pondCount] | add)) and all(.units[]; .pondCount >= 4 and .pondCount <= 6)'
          curl -sf -b c.txt 'localhost:8080/api/ponds/1/readings?range=24h' | jq -e '(.t | length > 0) and (.doPct | length > 0)'
          curl -sf -b c.txt 'localhost:8080/api/units/1/readings?range=24h' | jq -e '(.t | length > 0) and (.ph | length > 0)'
          curl -sf -b c.txt localhost:8080/api/units/1 | jq -e '.unit.ras.latest.ph != null'
          # Manual records: stored once, a re-send is a duplicate, invalid input is rejected.
          REC='{"items":[{"type":"water","clientId":"7d0f6b1e-3a52-4c1e-9f0a-0c8b6f2d4e11","data":{"unitId":1,"time":"'$(date -u +%FT%TZ)'","values":{"alkalinity":150}}},{"type":"feeding","clientId":"7d0f6b1e-3a52-4c1e-9f0a-0c8b6f2d4e12","data":{"pondId":1,"fedAt":"'$(date -u +%FT%TZ)'","feedKg":-1}}]}'
          curl -sf -b c.txt -H 'Content-Type: application/json' -d "$REC" localhost:8080/api/records | jq -e '[.results[].status] == ["ok","rejected"]'
          curl -sf -b c.txt -H 'Content-Type: application/json' -d "$REC" localhost:8080/api/records | jq -e '.results[0].status == "duplicate"'
          curl -sf -b c.txt localhost:8080/api/units/1 | jq -e '.records.water[0].values.alkalinity == 150'
          # Alert engine: an out-of-range test-kit value opens a water alarm; any role can acknowledge it.
          WATER='{"items":[{"type":"water","clientId":"7d0f6b1e-3a52-4c1e-9f0a-0c8b6f2d4e13","data":{"unitId":2,"time":"'$(date -u +%FT%TZ)'","values":{"no2":2.5}}}]}'
          curl -sf -b c.txt -H 'Content-Type: application/json' -d "$WATER" localhost:8080/api/records | jq -e '.results[0].status == "ok"'
          for i in $(seq 1 30); do
            ID=$(curl -sf -b c.txt localhost:8080/api/alarms | jq -r '[.alarms[] | select(.kind == "water")][0].id // empty')
            [ -n "$ID" ] && break
            sleep 2
          done
          test -n "$ID"
          curl -sf -b c.txt localhost:8080/api/alarms | jq -e '.stats.alerterOk == true'
          curl -sf -b c.txt -X POST localhost:8080/api/alarms/$ID/ack | jq -e '.ok'
          curl -sf -b c.txt localhost:8080/api/push/key | jq -e '.publicKey | length > 80'
          # A RAS serves at most 10 ponds: the 11th insert must fail.
          ! docker compose --env-file .env exec -T db psql -U sff -d sff -v ON_ERROR_STOP=1 -c "insert into ponds (farm_id, unit_id, code) select 1, 1, 'X' || g from generate_series(1, 7) g"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/farms)" = 401
      - if: failure()
        run: docker compose --env-file .env --profile sim logs --tail 100
      - if: always()
        run: docker compose --env-file .env --profile sim down -v
